# ICODOS-branded DocuSeal stack — sign.icodos.com
# Based on the original /opt/docuseal/docker-compose.yml, with:
#   1. Image pinned to a tested version (no surprise updates that could break the view overrides)
#   2. Branding overlay files mounted over the stock views (see ./branding)
#   3. Microsoft Entra SSO overlay (see ./sso)
#   4. Phase D — MCP OAuth 2.1 authorization server (see ./mcp)
#
# NOTE: ./secrets/mcp_oauth_signing_key.pem must exist BEFORE the first
# `docker compose up -d`. Docker creates a directory in place of a missing
# bind-mount source, which would leave the OAuth layer disabled. See README.
#
# Modified views are published at: https://github.com/ICODOS/docuseal-branding
# (AGPL-3.0 compliance — DocuSeal attribution retained per LICENSE_ADDITIONAL_TERMS)

services:
  app:
    image: docuseal/docuseal:3.1.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - docuseal:/data/docuseal
      - ./branding/submit_form__docuseal_logo.html.erb:/app/app/views/submit_form/_docuseal_logo.html.erb:ro
      - ./branding/start_form__docuseal_logo.html.erb:/app/app/views/start_form/_docuseal_logo.html.erb:ro
      - ./branding/mailer_attribution.html.erb:/app/app/views/shared/_mailer_attribution.html.erb:ro
      - ./branding/head_tags.html.erb:/app/app/views/layouts/_head_tags.html.erb:ro
      - ./branding/icodos-logo.png:/app/public/icodos-logo.png:ro
      - ./branding/shared__logo.html.erb:/app/app/views/shared/_logo.html.erb:ro
      - ./branding/shared__title.html.erb:/app/app/views/shared/_title.html.erb:ro
      - ./branding/shared__navbar.html.erb:/app/app/views/shared/_navbar.html.erb:ro
      - ./branding/pages_landing.html.erb:/app/app/views/pages/landing.html.erb:ro
      - ./branding/devise_sessions_new.html.erb:/app/app/views/devise/sessions/new.html.erb:ro
      - ./sso/entra_auth_controller.rb:/app/app/controllers/sso/entra_auth_controller.rb:ro
      - ./sso/zz_sso_entra.rb:/app/config/initializers/zz_sso_entra.rb:ro
      # --- Phase D: MCP OAuth 2.1 (delete this whole block to remove the code) ---
      - ./mcp/mcp_oauth.rb:/app/lib/mcp_oauth.rb:ro
      - ./mcp/oauth_api_controller.rb:/app/app/controllers/sso/oauth_api_controller.rb:ro
      - ./mcp/oauth_controller.rb:/app/app/controllers/sso/oauth_controller.rb:ro
      - ./mcp/oauth_consent.html.erb:/app/app/views/sso/oauth/consent.html.erb:ro
      - ./mcp/zz_mcp_oauth.rb:/app/config/initializers/zz_mcp_oauth.rb:ro
      # Signing key lives OUTSIDE this repo (./secrets is gitignored). Generate with:
      #   mkdir -p secrets && chmod 700 secrets
      #   openssl genrsa -out secrets/mcp_oauth_signing_key.pem 3072
      #   chown 2000:2000 secrets/mcp_oauth_signing_key.pem   # the app runs as uid 2000, not root
      #   chmod 400 secrets/mcp_oauth_signing_key.pem
      - ./secrets/mcp_oauth_signing_key.pem:/app/config/icodos/mcp_oauth_signing_key.pem:ro
      # --- end Phase D ---
      # --- Phase E: SharePoint contract filing (delete this whole block to remove the code) ---
      - ./contracts/icodos_graph.rb:/app/lib/icodos_graph.rb:ro
      - ./contracts/graph_check.rb:/app/lib/icodos_graph_check.rb:ro
      - ./contracts/create_contract_template_controller.rb:/app/app/controllers/mcp/icodos_create_contract_template_controller.rb:ro
      - ./contracts/send_contract_controller.rb:/app/app/controllers/mcp/icodos_send_contract_controller.rb:ro
      - ./contracts/filing_hook_controller.rb:/app/app/controllers/icodos/filing_hook_controller.rb:ro
      - ./contracts/zz_icodos_contracts.rb:/app/config/initializers/zz_icodos_contracts.rb:ro
      # BOTH halves of the certificate are needed. The private key signs the
      # client assertion; the certificate supplies the SHA-1 thumbprint Entra
      # uses to identify which uploaded credential signed it (the x5t header).
      # Mounting only the key produces AADSTS700027 at runtime.
      #   openssl req -x509 -newkey rsa:3072 -sha256 -days 730 -nodes \
      #     -keyout secrets/graph_filing_key.pem \
      #     -out    secrets/graph_filing_cert.pem \
      #     -subj "/CN=ICODOS DocuSeal Filing"
      #   chown 2000:2000 secrets/graph_filing_key.pem secrets/graph_filing_cert.pem
      #   chmod 400 secrets/graph_filing_key.pem
      #   chmod 444 secrets/graph_filing_cert.pem   # public half, but keep it readable by uid 2000
      - ./secrets/graph_filing_key.pem:/app/config/icodos/graph_filing_key.pem:ro
      - ./secrets/graph_filing_cert.pem:/app/config/icodos/graph_filing_cert.pem:ro
      # --- end Phase E ---
      # --- SSO API key reveal (delete this whole block to remove the code) ---
      # Lets SSO-provisioned users reveal their API key by re-authenticating
      # with Microsoft. They have no password to type: SSO provisioning sets a
      # random one, and SSO_ENFORCE blocks the reset flow.
      - ./reveal/icodos_reveal.rb:/app/lib/icodos_reveal.rb:ro
      # Filename must match the constant: Zeitwerk maps lib/x.rb to X, and a
      # mismatch stops the app booting rather than degrading.
      - ./reveal/reveal_check.rb:/app/lib/icodos_reveal_check.rb:ro
      - ./reveal/reveal_access_token_show.html.erb:/app/app/views/reveal_access_token/show.html.erb:ro
      - ./reveal/zz_icodos_reveal.rb:/app/config/initializers/zz_icodos_reveal.rb:ro
      # --- end SSO API key reveal ---
      # --- Reminders (delete this whole block to remove the code) ---
      # Automatic signature reminders, which DocuSeal ships only in Pro. Our
      # build has the reminder email template and audit event type but nothing
      # that schedules or sends. Filenames match their constants — Zeitwerk maps
      # lib/x.rb to X, and a mismatch stops the app booting.
      - ./reminders/icodos_reminders.rb:/app/lib/icodos_reminders.rb:ro
      - ./reminders/reminder_sweep.rb:/app/lib/icodos_reminder_sweep.rb:ro
      - ./reminders/reminder_check.rb:/app/lib/icodos_reminder_check.rb:ro
      - ./reminders/selftest.rb:/app/lib/icodos_reminders_selftest.rb:ro
      - ./reminders/reminder_mailer.rb:/app/app/mailers/icodos_reminder_mailer.rb:ro
      - ./reminders/zz_icodos_reminders.rb:/app/config/initializers/zz_icodos_reminders.rb:ro
      # --- end Reminders ---
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/docuseal
      - FORCE_SSL=${HOST}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID:-}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET:-}
      - SSO_ENFORCE=${SSO_ENFORCE:-false}
      - SSO_BREAK_GLASS=${SSO_BREAK_GLASS:-false}
      # Phase D — MCP OAuth 2.1. Off unless MCP_OAUTH_ENABLED=true.
      - MCP_OAUTH_ENABLED=${MCP_OAUTH_ENABLED:-false}
      - MCP_OAUTH_SIGNING_KEY_PATH=${MCP_OAUTH_SIGNING_KEY_PATH:-/app/config/icodos/mcp_oauth_signing_key.pem}
      - MCP_OAUTH_PREVIOUS_SIGNING_KEY_PATH=${MCP_OAUTH_PREVIOUS_SIGNING_KEY_PATH:-}
      - MCP_OAUTH_ISSUER=${MCP_OAUTH_ISSUER:-}
      - MCP_OAUTH_RESOURCE=${MCP_OAUTH_RESOURCE:-}
      - MCP_OAUTH_ALLOWED_REDIRECT_HOSTS=${MCP_OAUTH_ALLOWED_REDIRECT_HOSTS:-}
      - MCP_OAUTH_ACCESS_TOKEN_TTL=${MCP_OAUTH_ACCESS_TOKEN_TTL:-}
      - MCP_OAUTH_REFRESH_TOKEN_TTL=${MCP_OAUTH_REFRESH_TOKEN_TTL:-}
      # Phase E — SharePoint contract filing. Off unless ICODOS_CONTRACTS_ENABLED=true.
      - ICODOS_CONTRACTS_ENABLED=${ICODOS_CONTRACTS_ENABLED:-false}
      - ICODOS_GRAPH_TENANT_ID=${ICODOS_GRAPH_TENANT_ID:-}
      - ICODOS_GRAPH_CLIENT_ID=${ICODOS_GRAPH_CLIENT_ID:-}
      - ICODOS_GRAPH_KEY_PATH=${ICODOS_GRAPH_KEY_PATH:-/app/config/icodos/graph_filing_key.pem}
      - ICODOS_GRAPH_CERT_PATH=${ICODOS_GRAPH_CERT_PATH:-/app/config/icodos/graph_filing_cert.pem}
      - ICODOS_GRAPH_SITE_HOSTNAME=${ICODOS_GRAPH_SITE_HOSTNAME:-}
      - ICODOS_GRAPH_SITE_PATH=${ICODOS_GRAPH_SITE_PATH:-}
      - ICODOS_CONTRACTS_PATH_PREFIX=${ICODOS_CONTRACTS_PATH_PREFIX:-}
      # Domains the FIRST signer (the countersigning ICODOS entity) must belong
      # to. Defaults to icodos.com,icodos.de when unset — see the constant in
      # send_contract_controller.rb for why this guard exists.
      - ICODOS_CONTRACTS_FIRST_SIGNER_DOMAINS=${ICODOS_CONTRACTS_FIRST_SIGNER_DOMAINS:-}
      # SSO API key reveal. Off unless explicitly true; when off the upstream
      # password dialog is served unchanged.
      - ICODOS_SSO_REVEAL_ENABLED=${ICODOS_SSO_REVEAL_ENABLED:-false}
      # Reminders. DRY_RUN defaults to true: sending requires setting it to
      # false explicitly, so a half-finished deployment cannot start emailing.
      - ICODOS_REMINDERS_ENABLED=${ICODOS_REMINDERS_ENABLED:-false}
      - ICODOS_REMINDERS_DRY_RUN=${ICODOS_REMINDERS_DRY_RUN:-true}

  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=docuseal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from https://${HOST} --to app:3000
    volumes:
      - caddy_data:/data
    environment:
      - HOST=${HOST}

volumes:
  docuseal:
  pg_data:
  caddy_data:
